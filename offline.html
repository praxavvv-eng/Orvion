<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Orvion</title>
  <meta name="theme-color" content="#0b0b0f">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { background: #0b0b0f; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
      font-family: ui-sans-serif, system-ui, -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #f4f3f8;
      background:
        radial-gradient(800px 480px at 85% -10%, rgba(124, 58, 237, 0.2), transparent 62%),
        radial-gradient(640px 460px at -10% 8%, rgba(120, 140, 255, 0.09), transparent 62%),
        #0b0b0f;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 380px);
      padding: 36px 28px 30px;
      text-align: center;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02) 50%, rgba(255, 255, 255, 0)), rgba(30, 28, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 24px 60px -24px rgba(0, 0, 0, 0.8);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      backdrop-filter: blur(22px) saturate(165%);
    }
    .mark {
      width: 84px;
      height: 84px;
      margin: 0 auto 14px;
      filter: drop-shadow(0 8px 22px rgba(124, 58, 237, 0.55));
    }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 750; letter-spacing: -0.035em; }
    p { margin: 10px 0 0; font-size: 0.98rem; line-height: 1.55; color: rgba(244, 243, 248, 0.68); }
    .hint { margin-top: 22px; font-size: 0.82rem; color: rgba(244, 243, 248, 0.46); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    .primary {
      color: #fff;
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.92), #7c3aed);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 12px 26px -12px rgba(124, 58, 237, 0.75);
    }
    .secondary { color: #f4f3f8; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.12); }
    @media (prefers-reduced-transparency: reduce) {
      main { -webkit-backdrop-filter: none; backdrop-filter: none; background: #1d1c26; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/icons/logo.svg" width="84" height="84" alt="">
    <h1>You’re offline</h1>
    <p>Orvion can’t reach the internet right now. Check your connection and try again.</p>
    <div class="actions">
      <button class="btn primary" type="button" id="retry">Try again</button>
      <a class="btn secondary" href="/index.html">Go to Home</a>
    </div>
    <p class="hint" id="hint" role="status" aria-live="polite">Orvion will reload automatically when you’re back online.</p>
  </main>

  <script>
    (function () {
      var hint = document.getElementById('hint');
      function reload() { window.location.reload(); }
      document.getElementById('retry').addEventListener('click', function () {
        if (navigator.onLine) { reload(); return; }
        hint.textContent = 'Still offline – we’ll keep checking.';
      });
      window.addEventListener('online', reload);
    })();
  </script>
</body>
</html>
