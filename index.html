<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orvion · Home</title>
  <meta name="description" content="Discover trending movies and TV shows and keep track of what you watch.">

  <!-- Appearance (theme, accent, glass, density, motion) is applied before first paint -->
  <script src="js/boot.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orvion">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta property="og:title" content="Orvion">
  <meta property="og:description" content="Discover and track movies, series, anime and K-dramas.">
  <meta property="og:image" content="/icons/og-image.png">
</head>
<body class="home-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Orvion home">
      <img class="brand-mark" src="icons/logo.svg" width="40" height="40" alt="">
      <span class="brand-name">Orvion</span>
    </a>
    <div class="topbar-actions">
      <button id="installAppBtn" class="pill-btn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>
        <span>Install</span>
      </button>
      <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Appearance settings" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <h1 class="sr-only">Orvion – discover movies and TV shows</h1>

    <section class="hero" id="hero" aria-label="Featured titles">
      <div class="hero-track" id="heroTrack" role="region" aria-roledescription="carousel" aria-label="Featured titles" tabindex="0">
        <div class="hero-skeleton" aria-hidden="true"></div>
      </div>
      <div class="hero-dots" id="heroDots"></div>
    </section>

    <section class="section cw-section" id="cwSection" aria-labelledby="cwTitle" hidden>
      <div class="section-head">
        <h2 class="section-title" id="cwTitle">Continue watching<span class="count-badge" aria-hidden="true"></span></h2>
      </div>
      <div class="row" id="cwScroll"></div>
    </section>

    <section class="section" aria-labelledby="trendingTitle">
      <div class="section-head">
        <h2 class="section-title" id="trendingTitle">Trending</h2>
        <div class="row-controls" data-for="trendingScroll" data-label="Trending"></div>
      </div>
      <div class="row" id="trendingScroll"></div>
    </section>
    <section class="section" aria-labelledby="popularTitle">
      <div class="section-head">
        <h2 class="section-title" id="popularTitle">Popular</h2>
        <div class="row-controls" data-for="popularScroll" data-label="Popular"></div>
      </div>
      <div class="row" id="popularScroll"></div>
    </section>
    <section class="section" aria-labelledby="topRatedTitle">
      <div class="section-head">
        <h2 class="section-title" id="topRatedTitle">Top Rated</h2>
        <div class="row-controls" data-for="topRatedScroll" data-label="Top Rated"></div>
      </div>
      <div class="row" id="topRatedScroll"></div>
    </section>
    <section class="section" aria-labelledby="tvTitle">
      <div class="section-head">
        <h2 class="section-title" id="tvTitle">Popular TV Shows</h2>
        <div class="row-controls" data-for="tvScroll" data-label="Popular TV Shows"></div>
      </div>
      <div class="row" id="tvScroll"></div>
    </section>

    <noscript><p class="state-text" style="padding:24px var(--edge)">Orvion needs JavaScript to load movies and shows.</p></noscript>
  </main>

  <nav class="dock" aria-label="Primary">
    <a class="dock-item" href="index.html" aria-current="page">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 10.5L12 4.5l7.5 6V19a1 1 0 0 1-1 1H14v-5.5h-4V20H5.5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a class="dock-item" href="discover.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg>
      <span>Discover</span>
    </a>
    <a class="dock-item" href="search.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <span>Search</span>
    </a>
    <a class="dock-item" href="watchlist.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V5.5a1 1 0 0 1 1-1z"/></svg>
      <span>Watchlist</span>
    </a>
    <a class="dock-item" href="stats.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Stats</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
