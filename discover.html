<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Orvion · discover</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body class="discover-page">
  <main>
    <div class="discover-tabs glass">
      <button class="tab-btn active" data-type="movie">Movies</button>
      <button class="tab-btn" data-type="tv">TV Series</button>
    </div>
    <div class="discover-grid" id="discoverGrid"></div>
    <div class="loading-spinner" id="discoverLoader" style="display: none;">Loading...</div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v11h-6v-7h-6v7H3z"/></svg>
      <span>Home</span>
    </a>
    <a href="discover.html" class="nav-item active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span>Discover</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </a>
    <a href="watchlist.html" class="nav-item">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span>Watchlist</span>
    </a>
  </nav>

  <button id="installAppBtn" class="install-btn" style="display: none;">📱 Install App</button>

  <!-- Add to Watchlist modal -->
  <div class="modal" id="addModal">
    <div class="modal-content add-modal-content glass">
      <div class="modal-header">
        <h3>Add to watchlist</h3>
        <p class="modal-subtitle">Choose category and status</p>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>Category</label>
          <div class="custom-dropdown" id="categoryDropdown">
            <div class="dropdown-selected">Movie</div>
            <div class="dropdown-options">
              <div class="dropdown-option" data-value="movie">Movie</div>
              <div class="dropdown-option" data-value="series">Series</div>
              <div class="dropdown-option" data-value="anime">Anime</div>
              <div class="dropdown-option" data-value="kdrama">Kdrama</div>
            </div>
          </div>
        </div>
        <div class="input-group">
          <label>Status</label>
          <div class="custom-dropdown" id="statusDropdown">
            <div class="dropdown-selected">Plan to Watch</div>
            <div class="dropdown-options">
              <div class="dropdown-option" data-value="plan">Plan to Watch</div>
              <div class="dropdown-option" data-value="watching">Watching</div>
              <div class="dropdown-option" data-value="watched">Watched</div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn glass-btn" id="modalCancel">Cancel</button>
        <button class="btn accent-btn" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Details modal -->
  <div class="modal" id="detailsModal">
    <div class="modal-content details-modal glass">
      <button class="close-btn" id="closeDetails">&times;</button>
      <div class="details-backdrop" id="detailsBackdrop"></div>
      <div class="details-content">
        <div class="details-poster">
          <img id="detailsPoster" src="" alt="">
        </div>
        <div class="details-info">
          <h2 id="detailsTitle"></h2>
          <div class="details-meta">
            <span id="detailsYear"></span>
            <span class="rating" id="detailsRating">⭐ 0.0</span>
            <span id="detailsRuntime"></span>
          </div>
          <div class="details-genres" id="detailsGenres"></div>
          <div class="details-description" id="detailsOverview"></div>
          <div class="details-cast" id="detailsCast"></div>
          <div class="details-actions">
            <button class="btn details-add-btn accent-btn" id="detailsAddBtn">Add to watchlist</button>
            <a href="#" class="btn trailer-btn glass-btn" id="trailerBtn" target="_blank">▶ Watch Trailer</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>

  <!-- Firebase (modular) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js"
      }
    }
  </script>
  <script type="module">
    import { initializeApp } from "firebase/app";
    import { getFirestore } from "firebase/firestore";

    const firebaseConfig = {
      apiKey: "AIzaSyBjYQqk2a6eeiONwEqDxY3Mk5E7mrLnix0",
      authDomain: "orvion-a2cb2.firebaseapp.com",
      projectId: "orvion-a2cb2",
      storageBucket: "orvion-a2cb2.firebasestorage.app",
      messagingSenderId: "125083462622",
      appId: "1:125083462622:web:d6d61bc9753f036887cb4f",
      measurementId: "G-YTC7RGMVQX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
  </script>

  <script type="module" src="js/watchlist.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/discover.js"></script>

  <!-- Service Worker & Install Prompt -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'block';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User ${outcome} the installation`);
        deferredPrompt = null;
      });
    }
  </script>
</body>
</html>
