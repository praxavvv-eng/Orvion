<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orvion · Watchlist</title>
  <meta name="description" content="Your personal library of movies and TV shows.">

  <!-- Appearance (theme, accent, glass, density, motion) is applied before first paint -->
  <script src="js/boot.js"></script>

  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orvion">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta property="og:title" content="Orvion">
  <meta property="og:description" content="Discover and track movies, series, anime and K-dramas.">
  <meta property="og:image" content="/icons/og-image.png">
</head>
<body class="watchlist-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Orvion home">
      <img class="brand-mark" src="icons/logo.svg" width="34" height="34" alt="">
      <span class="brand-name">Orvion</span>
    </a>
    <div class="topbar-actions">
      <button id="installAppBtn" class="pill-btn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>
        <span>Install</span>
      </button>
      <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="page-head page-head-row">
      <div>
        <h1 class="page-title">Watchlist</h1>
        <p class="page-sub" id="watchlistSummary" aria-live="polite"></p>
      </div>
      <button class="btn btn-glass surprise-btn" id="surpriseBtn" type="button" hidden aria-label="Pick something to watch for me">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 4h4v4M4 20L20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>
        Surprise me
      </button>
    </div>

    <div class="toolbar">
      <div class="segmented" id="statusTabs" role="tablist" aria-label="Watch status">
        <button type="button" role="tab" id="status-plan" data-value="plan" aria-selected="true" aria-controls="watchlistContent"><span class="seg-label long">Plan to Watch</span><span class="seg-label short">Plan</span><span class="seg-count"></span></button>
        <button type="button" role="tab" id="status-watching" data-value="watching" aria-selected="false" aria-controls="watchlistContent"><span class="seg-label long">Watching</span><span class="seg-label short">Watching</span><span class="seg-count"></span></button>
        <button type="button" role="tab" id="status-watched" data-value="watched" aria-selected="false" aria-controls="watchlistContent"><span class="seg-label long">Watched</span><span class="seg-label short">Watched</span><span class="seg-count"></span></button>
        <button type="button" role="tab" id="status-dropped" data-value="dropped" aria-selected="false" aria-controls="watchlistContent"><span class="seg-label long">Dropped</span><span class="seg-label short">Dropped</span><span class="seg-count"></span></button>
      </div>
    </div>

    <div class="filters lib-filter-row">
      <label class="sr-only" for="libFilter">Filter this list by title</label>
      <input class="text-pill" id="libFilter" type="search" placeholder="Filter by title…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </div>

    <div class="filters">
      <div class="chips" id="categoryChips" role="group" aria-label="Filter by category" hidden></div>
      <label class="sr-only" for="sortSelect">Sort by</label>
      <select class="select-pill" id="sortSelect">
        <option value="added">Recently added</option>
        <option value="updated">Recently updated</option>
        <option value="rating">Your rating</option>
        <option value="title">A–Z</option>
      </select>
    </div>

    <div id="watchlistContent" role="tabpanel" aria-label="Your watchlist"></div>
  </main>

  <nav class="dock" aria-label="Primary">
    <a class="dock-item" href="index.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 10.5L12 4.5l7.5 6V19a1 1 0 0 1-1 1H14v-5.5h-4V20H5.5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a class="dock-item" href="discover.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg>
      <span>Discover</span>
    </a>
    <a class="dock-item" href="search.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <span>Search</span>
    </a>
    <a class="dock-item" href="watchlist.html" aria-current="page">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V5.5a1 1 0 0 1 1-1z"/></svg>
      <span>Watchlist</span>
    </a>
    <a class="dock-item" href="stats.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Stats</span>
    </a>
  </nav>
  <script src="js/nav.js"></script>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
