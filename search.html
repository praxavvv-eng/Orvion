<!DOCTYPE html>
<html lang="en" data-theme="dark" data-color="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orvion · Search</title>
  <meta name="description" content="Search movies and TV shows.">

  <!-- Appearance (theme, accent, glass, density, motion) is applied before first paint -->
  <script src="js/boot.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orvion">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta property="og:title" content="Orvion">
  <meta property="og:description" content="Discover and track movies, series, anime and K-dramas.">
  <meta property="og:image" content="/icons/og-image.png">
</head>
<body class="search-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Orvion home">
      <img class="brand-mark" src="icons/logo.svg" width="40" height="40" alt="">
      <span class="brand-name">Orvion</span>
    </a>
    <div class="topbar-actions">
      <button id="installAppBtn" class="pill-btn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 19.5h14"/></svg>
        <span>Install</span>
      </button>
      <button id="themeToggleBtn" class="icon-btn" type="button" aria-label="Appearance settings" aria-haspopup="dialog">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="page-head">
      <h1 class="page-title">Search</h1>
    </div>

    <form class="search-wrap" id="searchForm" role="search" autocomplete="off">
      <div class="search-field glass">
        <svg class="icon-search" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <label class="sr-only" for="searchInput">Search movies and TV shows</label>
        <input class="search-input" id="searchInput" name="q" type="search" placeholder="Movies, shows, anything…" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="icon-btn search-clear" id="searchClear" aria-label="Clear search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </form>

    <div class="filters" id="searchFilters" hidden>
      <div class="chips" id="typeChips" role="group" aria-label="Filter results by type"></div>
    </div>

    <div class="summary-bar" aria-live="polite">
      <span id="searchStatus"></span>
    </div>

    <section class="recent" id="recentSearches" aria-label="Recent searches" hidden></section>

    <div class="grid" id="searchResults" aria-live="polite"></div>
    <div class="page-footer" id="searchFooter" hidden></div>
    <div class="sentinel" id="searchSentinel"></div>
  </main>

  <nav class="dock" aria-label="Primary">
    <a class="dock-item" href="index.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4.5 10.5L12 4.5l7.5 6V19a1 1 0 0 1-1 1H14v-5.5h-4V20H5.5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a class="dock-item" href="discover.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg>
      <span>Discover</span>
    </a>
    <a class="dock-item" href="search.html" aria-current="page">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <span>Search</span>
    </a>
    <a class="dock-item" href="watchlist.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 4.5h10a1 1 0 0 1 1 1V20l-6-4-6 4V5.5a1 1 0 0 1 1-1z"/></svg>
      <span>Watchlist</span>
    </a>
    <a class="dock-item" href="stats.html">
      <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Stats</span>
    </a>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>

  <script src="js/search.js"></script>
</body>
</html>
