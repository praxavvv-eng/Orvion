  <!-- Search logic (fixed) -->
  <script>
    // ==================== SEARCH STATE ====================
    let searchTimeout;
    let currentQuery = '';
    let currentPage = 1;
    let isLoading = false;
    let hasMore = true;
    let totalPages = 1;
    let seenIds = new Set();

    const input = document.getElementById('searchInput');
    const resultsGrid = document.getElementById('searchResults');
    const historyContainer = document.getElementById('searchHistory');
    const loader = document.getElementById('searchLoader');

    // Helper: show skeleton loader
    function showSkeletonLoader() {
      resultsGrid.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const skeleton = document.createElement('div');
        skeleton.className = 'card-skeleton';
        resultsGrid.appendChild(skeleton);
      }
    }

    function showNoResults() {
      resultsGrid.innerHTML = '<p class="empty-message">No results found</p>';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Ranking: exact > startsWith > includes > popularity
    function rankResults(items, query) {
      const q = query.toLowerCase();
      return items.sort((a, b) => {
        const aTitle = (a.title || a.name || '').toLowerCase();
        const bTitle = (b.title || b.name || '').toLowerCase();
        if (aTitle === q && bTitle !== q) return -1;
        if (bTitle === q && aTitle !== q) return 1;
        if (aTitle.startsWith(q) && !bTitle.startsWith(q)) return -1;
        if (bTitle.startsWith(q) && !aTitle.startsWith(q)) return 1;
        return (b.popularity || 0) - (a.popularity || 0);
      });
    }

    // Render cards
    function renderResults(items, append = false) {
      if (!append) resultsGrid.innerHTML = '';
      items.forEach(item => {
        const title = item.title || item.name || 'Untitled';
        const poster = item.poster_path ? window.IMG_BASE + item.poster_path : 'https://via.placeholder.com/140x210?text=No+Image';
        const rating = item.vote_average ? item.vote_average.toFixed(1) : 'NR';
        const card = document.createElement('div');
        card.className = 'card-sm';
        card.dataset.id = item.id;
        card.dataset.type = item.media_type;
        card.innerHTML = `
          <div class="poster-container">
            <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/140x210?text=No+Image'">
            <div class="rating-badge">⭐ ${rating}</div>
          </div>
          <div class="title">${title}</div>
        `;
        card.addEventListener('click', () => {
          if (typeof window.showItemDetails === 'function') {
            window.showItemDetails(item.id, item.media_type);
          }
        });
        resultsGrid.appendChild(card);
      });
    }

    // Core search using movie + TV endpoints
    async function performSearch(query, page, replace) {
      if (isLoading) return;
      isLoading = true;
      if (loader) loader.style.display = 'block';
      try {
        // Use window.searchMovies and window.searchTV (now defined in api.js)
        const [movieData, tvData] = await Promise.all([
          window.searchMovies(query, page),
          window.searchTV(query, page)
        ]);
        console.log(`[Search] ${query} page ${page}: movies=${movieData.results?.length || 0}, tv=${tvData.results?.length || 0}`);

        let combined = [
          ...(movieData.results || []).map(m => ({ ...m, media_type: 'movie' })),
          ...(tvData.results || []).map(t => ({ ...t, media_type: 'tv' }))
        ];

        // Remove duplicates (id + media_type)
        const uniqueMap = new Map();
        for (const item of combined) {
          const key = `${item.id}_${item.media_type}`;
          if (!uniqueMap.has(key)) uniqueMap.set(key, item);
        }
        combined = Array.from(uniqueMap.values());

        const totalPagesMovie = movieData.total_pages || 1;
        const totalPagesTV = tvData.total_pages || 1;
        totalPages = Math.max(totalPagesMovie, totalPagesTV);

        if (replace) {
          const ranked = rankResults(combined, query);
          seenIds.clear();
          ranked.forEach(item => seenIds.add(`${item.id}_${item.media_type}`));
          renderResults(ranked);
          currentPage = page;
          hasMore = currentPage < totalPages;
        } else {
          const newItems = combined.filter(item => !seenIds.has(`${item.id}_${item.media_type}`));
          if (newItems.length === 0) {
            hasMore = false;
          } else {
            newItems.forEach(item => seenIds.add(`${item.id}_${item.media_type}`));
            renderResults(newItems, true);
            currentPage = page;
            hasMore = page < totalPages;
          }
        }
      } catch (err) {
        console.error('Search error', err);
        if (replace) showNoResults();
      } finally {
        isLoading = false;
        if (loader) loader.style.display = 'none';
      }
    }

    // Debounced input handler
    let debounceTimeout;
    input.addEventListener('input', (e) => {
      clearTimeout(debounceTimeout);
      const query = e.target.value.trim();
      currentQuery = query;
      if (query.length < 2) {
        resultsGrid.innerHTML = '';
        seenIds.clear();
        return;
      }
      showSkeletonLoader();
      debounceTimeout = setTimeout(() => performSearch(query, 1, true), 300);
    });

    // Infinite scroll
    window.addEventListener('scroll', () => {
      if (!currentQuery || isLoading || !hasMore) return;
      const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
      if (scrollTop + clientHeight >= scrollHeight - 200) {
        performSearch(currentQuery, currentPage + 1, false);
      }
    });

    // ==================== SEARCH HISTORY ====================
    const HISTORY_KEY = 'searchHistory';
    const MAX_HISTORY = 10;

    function getHistory() {
      try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
    }
    function addToHistory(q) {
      if (!q.trim()) return;
      let history = getHistory();
      history = history.filter(item => item !== q);
      history.unshift(q);
      if (history.length > MAX_HISTORY) history.pop();
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
    }
    function removeFromHistory(q) {
      let history = getHistory();
      history = history.filter(item => item !== q);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
    }
    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }
    function renderHistory() {
      const history = getHistory();
      if (history.length === 0) {
        historyContainer.classList.remove('show');
        return;
      }
      historyContainer.classList.add('show');
      let html = '<div class="history-header"><span>Recent searches</span><button class="clear-history">Clear all</button></div>';
      history.forEach(q => {
        html += `<div class="history-item" data-query="${q}">
          <span class="query">${q}</span>
          <button class="delete-item" data-query="${q}">✕</button>
        </div>`;
      });
      historyContainer.innerHTML = html;
      historyContainer.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-item')) return;
          const query = item.dataset.query;
          input.value = query;
          historyContainer.classList.remove('show');
          input.dispatchEvent(new Event('input'));
        });
      });
      historyContainer.querySelectorAll('.delete-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const query = btn.dataset.query;
          removeFromHistory(query);
        });
      });
      const clearBtn = historyContainer.querySelector('.clear-history');
      if (clearBtn) clearBtn.addEventListener('click', () => clearHistory());
    }

    input.addEventListener('focus', () => {
      if (getHistory().length > 0) renderHistory();
    });
    input.addEventListener('blur', () => {
      setTimeout(() => historyContainer.classList.remove('show'), 200);
    });
    input.addEventListener('change', () => {
      const q = input.value.trim();
      if (q.length >= 2) addToHistory(q);
    });

    // Initial API test (silent)
    (async function testApi() {
      try {
        const test = await window.searchMovies('test', 1);
        if (test.results) console.log('TMDB API working');
        else console.warn('TMDB API warning');
      } catch (err) {
        console.error('TMDB API key error:', err);
      }
    })();
  </script>

  <!-- Service Worker & Install Prompt (unchanged) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'block';
    });
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User ${outcome} the installation`);
        deferredPrompt = null;
      });
    }
  </script>
